<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Inconsolata', monospace;
            color: #0f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .terminal {
            width: 80%;
            max-width: 800px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .terminal::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(90deg, #0f0, #000);
            opacity: 0.1;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }
        
        .title {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
            animation: blink 1s infinite;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #0f0;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .command {
            margin-bottom: 15px;
        }
        
        .prompt {
            color: #0f0;
            margin-right: 10px;
        }
        
        .response {
            margin-left: 30px;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 0.5s;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .link {
            color: #0f0;
            text-decoration: none;
            position: relative;
        }
        
        .link::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: #0f0;
            transition: width 0.3s;
        }
        
        .link:hover::after {
            width: 100%;
        }
        
        .matrix-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        
        .typing {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #0f0;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #0f0; }
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0, 255, 0, 0.1) 0%,
                rgba(0, 255, 0, 0) 10%
            );
            background-size: 100% 8px;
            animation: scan 8s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <canvas id="matrix" class="matrix-effect"></canvas>
    <div class="scanline"></div>
    
    <div class="terminal">
        <div class="header">
            <div class="title">HACKER_TERMINAL<span class="cursor"></span></div>
            <div>USER: ROOT</div>
        </div>
        
        <div class="command">
            <span class="prompt">$</span> 
            <span class="typing">welcome --to --my-blog</span>
        </div>
        
        <div class="response" style="animation-delay: 1s;">
            > Initializing system...<br>
            > Loading content...<br>
            > Establishing secure connection...
        </div>
        
        <div class="response" style="animation-delay: 2s;">
            > STATUS: UNDER CONSTRUCTION<br>
            > ESTIMATED COMPLETION: [####----] 40%
        </div>
        
        <div class="response" style="animation-delay: 3s;">
            > CONNECT WITH ME ON: 
            <a href="https://www.linkedin.com/in/amar-mohamed-0xmaro" target="_blank" class="link">LINKEDIN</a>
        </div>
        
        <div class="response" style="animation-delay: 4s;">
            > SYSTEM READY<br>
            <span class="prompt">$</span> <span class="cursor"></span>
        </div>
    </div>

    <script>
        // Matrix effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const symbols = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';
        
        const alphabet = katakana + latin + nums + symbols;
        
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        
        const rainDrops = [];
        
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }
        
        const draw = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };
        
        setInterval(draw, 30);
        
        // Terminal typing effect
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const cursor = document.querySelector('.terminal .cursor');
                if (cursor) cursor.style.animation = 'none';
            }, 4000);
        });
        
        // Responsive canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
