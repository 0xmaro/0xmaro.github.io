event:
  en: Built "Qader A1" (V1 Arduino → V2 ESP32 Wi-Fi Radar Robot)
  ar: بناء أول مشروع هندسي متكامل "Qader A1" (من Arduino إلى ESP32 برادار ويب)
summary:
  en: First full engineering project — led the software stack from an Arduino Uno + IR receiver prototype (V1) to an ESP32 Wi-Fi web server (V2) featuring real-time radar visualization, multi-directional motor control, ultrasonic distance tracking, laser targeting, and automated return-to-start navigation.
  ar: أول مشروع هندسي متكامل — قدت فيه تطوير البرمجيات من نسخة V1 على Arduino Uno مع IR وحساسات ومكونات مُعاد تدويرها، إلى نسخة V2 على ESP32 بسيرفر ويب عبر Wi-Fi يعرض رادار حي للمسافات، تحكّم في الموتورات والسرعة، تصويب ليزر، وميزة العودة التلقائية لنقطة البداية.
learned:
  en: Bridging C++ firmware with an HTML/CSS/JS control interface over Wi-Fi taught me how embedded devices expose real network attack surfaces — the exact intuition behind my later IoT security work.
  ar: ربط كود الـ C++ على المتحكم بواجهة ويب عبر Wi-Fi علّمني عملياً إزاي أجهزة الـ IoT بتفتح سطح هجوم شبكي حقيقي — وده نفس التفكير اللي استخدمته بعدين في أمن الأنظمة المدمجة.
