event:
  en: GDSC Benha 7-Day Cybersecurity Bootcamp — 1st Place on Leaderboard
  ar: معسكر الأمن السيبراني (7 أيام) في GDSC بنها — المركز الأول
summary:
  en: First hands-on cybersecurity immersion covering Linux fundamentals & privilege concepts, password cracking (John the Ripper), networking with Scapy & Wireshark, web exploitation (XSS & SQLi), and cryptography — finishing #1 on the bootcamp leaderboard.
  ar: أول تجربة عملية مكثّفة في الأمن السيبراني شملت أساسيات ومتقدّم Linux، كسر كلمات المرور (John the Ripper)، تحليل الشبكات بـ Scapy وWireshark، ثغرات الويب (XSS وSQLi)، والتشفير — وانتهت بتصدّر لوحة النقاط بالمركز الأول.
learned:
  en: That week turned cybersecurity from a topic I read about into something I wanted to practice every day — and set the standard I would later bring back to the same campus as a trainer.
  ar: الأسبوع ده حوّل الأمن السيبراني من مجال بقرأ عنه لحاجة بمارسها يومياً — ووضع المستوى اللي رجعت أدرّس بيه في نفس الجامعة بعدها بسنتين.
