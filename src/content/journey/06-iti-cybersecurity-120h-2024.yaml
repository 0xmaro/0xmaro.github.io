summary:
  en: Completed a 120-hour intensive at ITI Banha (21 Jul – 15 Aug 2024) spanning Network Fundamentals (24h), Advanced Networking (24h), Cyber Security Essentials (18h), Ethical Hacking (24h), Palo Alto PCCET (12h), and Fortinet NSE4 (18h), with practical labs in XSS, SQLi, Access Control, Wireshark/Nmap, and VulnHub privilege escalation.
  ar: إتمام برنامج تدريبي مكثّف لمدة 120 ساعة في معهد تكنولوجيا المعلومات (21 يوليو – 15 أغسطس 2024) شمل أساسيات ومتقدّم الشبكات (48 ساعة)، أساسيات الأمن السيبراني (18 ساعة)، الاختراق الأخلاقي (24 ساعة)، Palo Alto PCCET (12 ساعة)، وFortinet NSE4 (18 ساعة) مع تطبيقات عملية على XSS وSQLi وصلاحيات الوصول وVulnHub.
learned:
  en: Pairing enterprise firewall policy (Fortigate / Palo Alto) with hands-on exploitation on VulnHub made me see both sides of the wire — what a perimeter blocks and what slips straight through application logic.
  ar: الجمع بين سياسات الجدران النارية (Fortigate وPalo Alto) والاستغلال العملي على VulnHub خلّاني أشوف الطرفين — إيه اللي الشبكة بتوقّفه، وإيه اللي بيعدّي من منطق التطبيق نفسه.
