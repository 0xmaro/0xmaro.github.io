role:
  en: Cybersecurity Technical Trainer & Core Team
  ar: مدرّب أمن سيبراني وعضو الفريق التقني الأساسي
event:
  en: Cybersecurity Instructor & CTF Author — GDG on Campus (Benha & CIC)
  ar: مدرّب أمن سيبراني ومطوّر تحديات CTF — GDG on Campus (بنها وCIC)
summary:
  en: Returned to the community as a volunteer trainer across two campuses. At GDG Benha (24/25 Core Team), delivered a 5-day hands-on bootcamp (Linux, Network Security, SQLi/XSS/Command Injection, Crypto & Forensics), authored vulnerable PHP web challenges, co-organized a CTF on WARZONE with Cyber Cohesion, and hosted an exclusive Blue Team/DFIR session with Islam Mostafa (Senior DFIR Engineer at EG-CERT, GCFA, Black Hat MEA speaker). Simultaneously served as Track Instructor for the 27-week Cybersecurity Track at GDG on Campus CIC.
  ar: 'التطوّع لتدريب الطلاب وبناء مجتمع أمن سيبراني عملي في جامعتين: في GDG جامعة بنها قدّمت معسكراً عملياً من 5 أيام (Linux، أمن الشبكات، SQLi وXSS وCommand Injection، التشفير والتحليل الجنائي)، وبنيت تحديات ويب حقيقية على GitHub، وشاركت في تنظيم مسابقة CTF على منصة WARZONE مع Cyber Cohesion، واستضفت جلسة Blue Team وDFIR مع م. إسلام مصطفى (EG-CERT وGCFA ومتحدث Black Hat MEA). وبالتوازي شاركت كـ Track Instructor لمسار الأمن السيبراني (27 أسبوعاً) في GDG الجامعة الكندية (CIC).'
learned:
  en: Writing vulnerable challenges for students to exploit — and explaining why the fix works — is the fastest stress-test for your own understanding of application security.
  ar: تصميم تحديات مصابة بالثغرات عشان الطلاب يستغلوها — وشرح ليه الإصلاح بيقفلها فعلاً — هو أقوى اختبار حقيقي لفهمك لأمن التطبيقات.
