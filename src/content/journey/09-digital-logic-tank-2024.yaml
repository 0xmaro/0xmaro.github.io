event:
  en: Autonomous Obstacle-Avoiding & Line-Following Tank — Pure Digital Logic (Zero Code)
  ar: بناء دبابة ذاتية الحركة وتتفادى العوائق بدوائر منطقية فقط (بدون سطر كود واحد)
summary:
  en: Designed and wired a fully hardware-driven autonomous tank using zero software or microcontrollers — combining IR TCRT5000 line tracking, HC-SR04 ultrasonic obstacle detection, dual 555 timers, L298 motor driver, NAND/NOT logic gates (IC 7400/7404), and a CD74HC4051 multiplexer/demultiplexer.
  ar: تصميم وتوصيل دبابة ذاتية الحركة بالكامل باستخدام البوابات المنطقية فقط بدون متحكم أو كود — عبر دمج حساسات IR TCRT5000 لتتبع الخط الأسود، حساس Ultrasonic HC-SR04 لتفادي العوائق والتوقف التلقائي، مؤقّتات 555، درايفر L298، بوابات NAND/NOT، وMultiplexer CD74HC4051.
learned:
  en: Building state machines out of physical logic gates strips away every layer of abstraction — when you understand hardware truth tables, software control flow becomes crystal clear.
  ar: بناء منطق اتخاذ القرار ببوابات إلكترونية حقيقية بيشيل كل طبقات التجريد — لما تفهم جداول الحقيقة على الهاردوير، منطق السوفتوير كله بيبقى شفاف قدامك.
