summary:
  en: Invited to evaluate student robotics and AI projects at the Egyptian League for Robotics & AI (backed by STEMpedia, AWS, ARTPARK, Motwani Jadeja Foundation, and Mechaverse League) — assessing architecture, working demos, and problem-solving under pressure.
  ar: شاركت كمُحكّم تقني لتقييم مشاريع الروبوتات والذكاء الاصطناعي في الدوري المصري (بشراكة STEMpedia وAWS وARTPARK وMechaverse League وCodeavour 5.0) — مع تقييم التصميم والتنفيذ العملي وحل المشكلات.
learned:
  en: Reviewing dozens of working and broken prototypes in a single day sharpens your eye for real engineering versus slideware — and pushed me to build Qader A1 right after.
  ar: تقييم عشرات النماذج الشغّالة والمتعطلة في يوم واحد بيخلّيك تفرّق فوراً بين الهندسة الحقيقية والكلام النظري — وده اللي حمّسني أبني مشروع Qader A1 بعدها مباشرة.
