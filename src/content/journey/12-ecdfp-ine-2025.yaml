summary:
  en: Passed INE's hands-on eCDFP certification exam (ID 141476433) covering digital forensics fundamentals, forensic evidence acquisition, disk & file system examination, Windows & network forensics, log analysis, timeline reconstruction, and incident reporting.
  ar: اجتياز امتحان شهادة eCDFP العملية من INE Security (رقم الاعتماد 141476433)، شاملة جمع الأدلة الجنائية الرقمية، فحص الأقراص وأنظمة الملفات، التحليل الجنائي لـ Windows والشبكات، تحليل السجلات، إعادة بناء الخط الزمني للحوادث، وكتابة التقارير.
learned:
  en: Blue-team forensics made me a sharper AppSec engineer — knowing exactly what artifacts survive an attack makes it obvious what telemetry an application must log from day one.
  ar: التحليل الجنائي خلّاني مهندس AppSec أدق — لما تعرف بالظبط إيه الآثار اللي بتفضل بعد أي اختراق، بتعرف فوراً إيه السجلات اللي لازم التطبيق يوثّقها من أول يوم.
