summary:
  en: Competed with team liel0x1 in one of Egypt's largest university cybersecurity competitions (CSC-3, Military Technical College). Solved all 5/5 qualification challenges (1777 pts), qualifying among the top 25 university teams nationwide for the onsite second round on 26 July 2025.
  ar: المشاركة مع فريق liel0x1 في واحدة من أكبر مسابقات الأمن السيبراني الجامعية في مصر بالكلية الفنية العسكرية (CSC-3). حللنا كل تحديات التصفيات (5/5 بإجمالي 1777 نقطة) وتأهلنا ضمن أفضل 25 فريقاً على مستوى الجمهورية للجولة الحضورية بتاريخ 26 يوليو 2025.
learned:
  en: Onsite time-boxed CTFs reward calm triage and team division of labor far more than solo heroics.
  ar: المسابقات الحضورية المقيّدة بالوقت بتكافئ التنظيم الهادئ وتوزيع المهام داخل الفريق أكتر بكتير من الشغل الفردي.
